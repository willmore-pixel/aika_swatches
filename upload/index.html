<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>快速色卡上架</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Shop-only page: shoot or pick a swatch photo in the studio's frame (5–30 cm, set on the camera screen), name it, and publish it
   straight into the leather/ or canvas/ folder of this repo through the GitHub API. Same dark look as the studio. */
:root {
  --bg: #131f24; --panel: #18262c; --tile: #1d2c33; --line: #37464f; --fg: #f1f7fb; --muted: #8a9ba5;
  --accent: #49c0f8; --accent-ink: #0b2a3a; --ok: #58cc02; --bad: #ff4b4b;
  --font: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); margin: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, label:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 2px solid var(--line); }
header h1 { margin: 0; font-size: 19px; font-weight: 800; }
header h1 span { color: var(--muted); font-weight: 700; font-size: 14px; }
.link-btn { font-weight: 800; font-size: 14px; color: var(--accent); padding: 6px 2px; }
main { padding: 16px; display: grid; gap: 16px; }
.note { margin: 0; padding: 10px 12px; border-radius: 12px; background: #2b2a1a; color: #ffd27a; font-size: 14px; font-weight: 700; line-height: 1.45; }
.pickers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { position: relative; display: grid; place-items: center; gap: 6px; padding: 22px 8px; border-radius: 18px; border: 2px dashed var(--line); background: var(--tile); font-weight: 800; font-size: 15px; cursor: pointer; }
.big i { font-style: normal; font-size: 34px; }
.big input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 14px; }
.card[hidden] { display: none; }
.preview { width: min(100%, 300px); aspect-ratio: 1; justify-self: center; border-radius: 12px; overflow: hidden; background: var(--tile); }
.preview canvas { width: 100%; height: 100%; display: block; }
.label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .08em; margin-bottom: 6px; display: block; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { padding: 11px; border-radius: 14px; border: 2px solid var(--line); background: var(--tile); font-weight: 800; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: #213a47; color: var(--accent); }
.field { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--tile); color: var(--fg); font: inherit; font-size: 16px; font-weight: 700; }
.row { display: flex; gap: 10px; }
.btn { flex: 1; padding: 12px; border-radius: 14px; border: 2px solid var(--line); font-weight: 900; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 3px 0 #1b8ec2; }
.btn:disabled { opacity: .5; cursor: default; }
.status { margin: 0; font-size: 14px; font-weight: 800; line-height: 1.45; min-height: 1em; }
.status.ok { color: var(--ok); } .status.bad { color: var(--bad); } .status.wait { color: var(--muted); }
.status:empty { display: none; }
h2 { margin: 0; font-size: 15px; font-weight: 800; color: var(--muted); letter-spacing: .06em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
.sw { display: grid; gap: 4px; font-size: 12px; font-weight: 700; text-align: center; color: var(--muted); }
.sw i { display: block; aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--line); background: var(--tile) center / cover; }
.sw.new i { border-color: var(--ok); }
.sw { position: relative; }
.sw.gone { opacity: .45; }
.sw .x { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; background: var(--bad); color: #fff; font-size: 14px; line-height: 24px; font-weight: 900; padding: 0; }
.sw.armed i { border-color: var(--bad); }
.sw.armed .x { width: auto; padding: 0 8px; border-radius: 99px; font-size: 12px; }
.list-head { display: flex; justify-content: space-between; align-items: center; }
.heads { display: flex; gap: 14px; }
/* 下架 / 上架 buttons sit on the tile's corner like the delete ×. */
.sw .act { position: absolute; top: -6px; right: -6px; height: 24px; padding: 0 9px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 12px; line-height: 24px; font-weight: 900; }
.sw .act.up { background: var(--ok); color: #fff; }
.off i { filter: grayscale(.7); opacity: .7; }
.hidden-head { margin: 6px 0 10px; }
.small { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.5; }
.small a { color: var(--accent); }

/* Camera and crop view: copied from the studio (square guide of 5–30 cm with a cm ruler; only the square is kept). */
.cam { position: fixed; inset: 0; z-index: 20; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
.cam[hidden] { display: none; }
.cam img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; }
.cam .crop-only, .cam.crop .cam-only { display: none; }
.cam.crop .crop-only { display: block; }
.use { justify-self: center; padding: 12px 26px; border-radius: 99px; background: #fff; color: #111; font-weight: 900; font-size: 16px; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam-frame { position: absolute; left: 50%; top: 44%; width: min(84vw, 58vh); aspect-ratio: 1; transform: translate(-50%, -50%); box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); border: 2px solid #fff; }
.cam-frame svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cam-wake { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); z-index: 1; padding: 14px 26px; border: 0; border-radius: 99px; background: #fff; color: #111; font: inherit; font-weight: 900; font-size: 16px; cursor: pointer; }
.cam-hint { position: absolute; left: 16px; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); margin: 0; text-align: center; color: #fff; font-size: 15px; font-weight: 800; line-height: 1.45; text-shadow: 0 1px 3px #000; }
.cam-hint small { display: block; font-size: 12px; font-weight: 700; opacity: .85; }
.cam-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 24px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; color: #fff; font-weight: 800; font-size: 14px; }
.cam-bar > :first-child { justify-self: start; } .cam-bar label { justify-self: end; position: relative; }
.cam-bar input { position: absolute; inset: 0; opacity: 0; width: 100%; }
.shutter { width: 70px; height: 70px; border-radius: 50%; background: #fff; border: 5px solid rgba(255,255,255,.4); background-clip: padding-box; }
.shutter:active { transform: scale(.94); }
.cam-size { position: absolute; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(84vw, 360px); display: flex; align-items: center; gap: 10px; color: #fff; font-size: 14px; font-weight: 800; text-shadow: 0 1px 3px #000; }
.cam-size b { min-width: 64px; text-align: center; font-size: 16px; font-weight: 900; }
.cam-size button { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,.35); color: #fff; font-size: 20px; line-height: 1; padding: 0; }
.cam-size input { flex: 1; min-width: 0; accent-color: #fff; }
</style>
</head><body>
<div class="app">
  <header>
    <h1>快速色卡上架 <span>店家專用</span></h1>
    <button class="link-btn" id="openKey" type="button">設定</button>
  </header>

  <main>
    <p class="note" id="trialNote" hidden>試用模式：可以拍照、裁切、命名，但不會真的上架。要正式上架，請先按右上角「設定」輸入上架金鑰。</p>

    <div class="card" id="keyCard" hidden>
      <div>
        <span class="label">上架金鑰（GitHub token）</span>
        <input class="field" id="keyInput" type="password" autocomplete="off" placeholder="github_pat_…">
      </div>
      <p class="small">只要在這支手機輸入一次。金鑰只存在這支手機的瀏覽器裡。</p>
      <div class="row">
        <button class="btn" id="keyClear" type="button">清除</button>
        <button class="btn primary" id="keySave" type="button">儲存</button>
      </div>
      <p class="status" id="keyStatus"></p>
    </div>

    <div class="pickers" id="pickers">
      <label class="big"><i>📷</i>拍照<input id="snapIn" type="file" accept="image/*" capture="environment"></label>
      <label class="big"><i>🖼️</i>從相簿選<input id="albumIn" type="file" accept="image/*"></label>
    </div>

    <div class="card" id="editCard" hidden>
      <div class="preview"><canvas id="out" width="1024" height="1024"></canvas></div>
      <p class="small" id="shotSize"></p>
      <div>
        <span class="label">照片處理</span>
        <div class="seg" id="seams">
          <button type="button" data-seam="0" aria-pressed="true">原圖</button>
          <button type="button" data-seam="1" aria-pressed="false">無縫處理 2+</button>
        </div>
      </div>
      <div>
        <span class="label">種類</span>
        <div class="seg" id="kinds">
          <button type="button" data-kind="leather" aria-pressed="true">皮革</button>
          <button type="button" data-kind="canvas" aria-pressed="false">布樣</button>
        </div>
      </div>
      <div>
        <span class="label">名稱（客人看到的名字）</span>
        <input class="field" id="name" type="text" maxlength="40" placeholder="例如：焦糖 Caramel" enterkeyhint="done">
      </div>
      <div class="row">
        <button class="btn" id="retake" type="button">重拍</button>
        <button class="btn primary" id="publish" type="button">上架</button>
      </div>
    </div>

    <p class="status" id="status"></p>

    <div class="list-head"><h2>目前的色卡</h2><div class="heads"><button class="link-btn" id="hideList" type="button">下架</button><button class="link-btn" id="editList" type="button">刪除</button></div></div>
    <p class="status" id="listStatus"></p>
    <div class="grid" id="list"></div>
    <p class="small" id="listNote"></p>
    <div id="offWrap" hidden>
      <h2 class="hidden-head">已下架 <span class="small">客人看不到，照片還在，按「上架」就回來</span></h2>
      <div class="grid off" id="offList"></div>
    </div>
  </main>
</div>

<div class="cam" id="cam" hidden>
  <video id="camVideo" class="cam-only" playsinline muted autoplay></video>
  <button type="button" class="cam-wake cam-only" id="camWake" hidden>開啟相機</button>
  <img id="cropImg" class="crop-only" alt="" draggable="false">
  <div class="cam-frame" id="camFrame"><svg viewBox="0 0 300 300" aria-hidden="true" id="camRuler"></svg></div>
  <p class="cam-hint cam-only">把 <span class="cm">30</span> × <span class="cm">30</span> cm 的皮料或布料放滿框內<small>框邊的刻度是公分，可以在旁邊放一把尺對齊。框的大小用下面的滑桿調。</small></p>
  <p class="cam-hint crop-only">拖曳、雙指縮放照片，讓 <span class="cm">30</span> × <span class="cm">30</span> cm 放滿框內<small>框邊的刻度是公分。框的大小用下面的滑桿調。</small></p>
  <div class="cam-size"><button type="button" id="camLess" aria-label="框小一點">−</button><input type="range" id="camCm" min="5" max="30" step="1" value="30" aria-label="框的大小"><button type="button" id="camMore" aria-label="框大一點">+</button><b>框<br><span class="cm">30</span> cm</b></div>
  <div class="cam-bar">
    <button type="button" id="camCancel">取消</button>
    <button type="button" class="shutter cam-only" id="camShot" aria-label="拍照"></button>
    <button type="button" class="use crop-only" id="cropUse">使用</button>
    <label class="cam-only">系統相機<input id="camNative" type="file" accept="image/*" capture="environment"></label>
    <span class="crop-only"></span>
  </div>
</div>

<script>
const REPO = "willmore-pixel/aika_swatches";
const SITE = "https://willmore-pixel.github.io/aika_swatches/";
const KIND_NAME = { leather: "皮革", canvas: "布樣" };
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
};
let token = store.get("aika-upload-token");
let kind = "leather", haveShot = false, shotCm = 30;
const pending = [];  // swatches published from this page that the swatch site hasn't listed yet

function say(el, text, cls) { el.textContent = text; el.className = "status" + (cls ? " " + cls : ""); }
function showTrial() { $("trialNote").hidden = !!token; $("publish").textContent = token ? "上架" : "上架（試用）"; }

// ---- Upload key: entered once per phone, kept only in this browser. ----
$("openKey").addEventListener("click", () => { $("keyCard").hidden = !$("keyCard").hidden; $("keyInput").value = token; say($("keyStatus"), ""); });
$("keyClear").addEventListener("click", () => { token = ""; store.set("aika-upload-token", ""); $("keyInput").value = ""; showTrial(); say($("keyStatus"), "已清除，現在是試用模式。", "wait"); });
$("keySave").addEventListener("click", async () => {
  const t = $("keyInput").value.trim();
  if (!t) return say($("keyStatus"), "請貼上金鑰。", "bad");
  say($("keyStatus"), "檢查中…", "wait");
  try {
    const r = await gh("", { token: t });
    if (!r.ok) throw new Error(r.status === 401 ? "金鑰不正確或已過期。" : "這把金鑰打不開色卡資料庫。");
    const repo = await r.json();
    if (!repo.permissions?.push) throw new Error("這把金鑰沒有寫入權限（Contents 要選 Read and write）。");
    token = t; store.set("aika-upload-token", t); showTrial();
    say($("keyStatus"), "已儲存，可以正式上架了 ✓", "ok");
    setTimeout(() => { $("keyCard").hidden = true; }, 1200);
  } catch (e) { say($("keyStatus"), e.message === "Failed to fetch" ? "連不上 GitHub，請確認網路。" : e.message, "bad"); }
});
function gh(path, { token: t = token, method = "GET", body } = {}) {
  return fetch(`https://api.github.com/repos/${REPO}${path}`, {
    method, cache: "no-store",
    headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${t}`, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body && JSON.stringify(body)
  });
}

// ---- Kind and name ----
$("kinds").addEventListener("click", e => {
  const b = e.target.closest("[data-kind]"); if (!b) return;
  kind = b.dataset.kind;
  $("kinds").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
});
const cleanName = s => s.replace(/[\\/:*?"<>|#%\u0000-\u001f]/g, " ").replace(/\s+/g, " ").trim().replace(/^\.+/, "");

// ---- The chosen square becomes a 1024 px JPEG (the size the swatch site keeps), shown on the shoe as camCm x camCm
// (kept in sizes.json). It goes up as the original photo unless 無縫處理 2+ is chosen (the shop wants the original by default). ----
let rawShot = null;
function showShot(seam) {
  $("seams").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.seam === (seam ? "1" : "0")));
  $("out").getContext("2d").drawImage(seam ? makeSeamless(rawShot, 1024) : rawShot, 0, 0);
}
$("seams").addEventListener("click", e => { const b = e.target.closest("[data-seam]"); if (b && rawShot) showShot(b.dataset.seam === "1"); });
function setShot(src, sx, sy, side) {
  rawShot = document.createElement("canvas"); rawShot.width = rawShot.height = 1024;
  rawShot.getContext("2d").drawImage(src, sx, sy, side, side, 0, 0, 1024, 1024);
  showShot(false);
  haveShot = true; shotCm = camCm;
  $("shotSize").textContent = `這張代表 ${shotCm} × ${shotCm} cm，鞋子上會照這個大小重複鋪。`;
  $("editCard").hidden = false; $("pickers").hidden = true;
  say($("status"), "");
  $("editCard").scrollIntoView({ block: "start" });
}
$("retake").addEventListener("click", () => { haveShot = false; $("editCard").hidden = true; $("pickers").hidden = false; say($("status"), ""); });

$("publish").addEventListener("click", async () => {
  const name = cleanName($("name").value);
  if (!haveShot) return;
  if (!name) { $("name").focus(); return say($("status"), "請先輸入名稱。", "bad"); }
  const path = `${kind}/${name}.jpg`;
  if (!token) {
    return say($("status"), `試用模式：正式上架時，這張會放進「${KIND_NAME[kind]}」，名稱「${name}」，大小 ${shotCm} cm，約 1–2 分鐘後出現在網站。這次沒有上架。`, "wait");
  }
  $("publish").disabled = true; $("retake").disabled = true;
  try {
    say($("status"), "上傳中…", "wait");
    // Same name in either folder would confuse customers, so refuse instead of overwriting.
    if (await nameTaken(name)) throw new Error(`已經有叫「${name}」的色卡，請換個名字。`);
    const blob = await new Promise(res => $("out").toBlob(res, "image/jpeg", 0.9));
    const b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(",")[1]); fr.readAsDataURL(blob); });
    const r = await gh(`/contents/${encodeURIComponent(kind)}/${encodeURIComponent(name + ".jpg")}`, { method: "PUT", body: { message: `Add swatch ${name} (${kind})`, content: b64 } });
    if (!r.ok) throw new Error(r.status === 401 ? "金鑰不正確或已過期，請到「設定」重新輸入。" : r.status === 403 || r.status === 404 ? "這把金鑰沒有寫入權限。" : `上傳失敗（${r.status}），請再試一次。`);
    await editJson("sizes.json", {}, m => ({ ...m, [`${kind}/${name}`]: shotCm }), `Swatch ${name} (${kind}) is ${shotCm} cm`);
    pending.push({ name, kind, cm: shotCm, url: $("out").toDataURL("image/jpeg", 0.6) });
    haveShot = false; $("name").value = ""; $("editCard").hidden = true; $("pickers").hidden = false;
    say($("status"), `「${name}」已上傳，網站更新中（約 1–2 分鐘）…`, "wait");
    renderList(); watchSite();
  } catch (e) {
    say($("status"), e.message === "Failed to fetch" ? "連不上 GitHub，請確認網路後再按一次。" : e.message, "bad");
  } finally { $("publish").disabled = false; $("retake").disabled = false; }
});
async function nameTaken(name) {
  for (const k of ["leather", "canvas"]) {
    const r = await gh(`/contents/${k}`);
    if (r.ok && (await r.json()).some(f => f.name.replace(/\.[^.]+$/, "") === name)) return true;
  }
  return SHOP.some(s => s.name === name) || OFF.some(s => s.name === name);
}

// ---- What customers see now (the swatch site's list), plus anything just uploaded that is still being published,
// and what is 下架 (off the shelf: kept in the repo, listed in hidden.json, not shown to customers). ----
let SHOP = [], OFF = [], watching = null;
async function loadShop() {
  try {
    const [r, h] = await Promise.all([fetch(SITE + "swatches.json", { cache: "no-store" }), fetch(SITE + "swatches-hidden.json", { cache: "no-store" })]);
    if (r.ok) SHOP = await r.json();
    if (h.ok) OFF = await h.json();
    $("listNote").textContent = "";
  } catch { $("listNote").textContent = "現在讀不到網站上的色卡清單。"; }
  for (let i = pending.length - 1; i >= 0; i--) if (SHOP.some(s => s.name === pending[i].name && s.kind === pending[i].kind)) {
    say($("status"), `「${pending[i].name}」已上架 ✓ 客人重新整理網站就看得到。`, "ok");
    pending.splice(i, 1);
  }
  const listed = key => SHOP.some(s => s.kind + "/" + s.name === key), off = key => OFF.some(s => s.kind + "/" + s.name === key);
  const nameOf = key => key.split("/").slice(1).join("/");
  for (const key of [...removing]) if (!listed(key) && !off(key)) { removing.delete(key); say($("listStatus"), `「${nameOf(key)}」已刪除 ✓`, "ok"); }
  for (const key of [...hiding]) if (off(key)) { hiding.delete(key); say($("listStatus"), `「${nameOf(key)}」已下架 ✓ 客人看不到了。`, "ok"); }
  for (const key of [...showing]) if (listed(key)) { showing.delete(key); say($("listStatus"), `「${nameOf(key)}」已重新上架 ✓`, "ok"); }
  renderList();
}
function renderList() {
  const cell = (n, k, url, isNew, isOff, cm) => {
    const key = k + "/" + n, gone = removing.has(key), armed = armedKey === key, busy = gone || hiding.has(key) || showing.has(key);
    const btn = isNew || busy ? ""
      : mode === "delete" ? `<button class="x" type="button" data-del="${esc(key)}" aria-label="刪除 ${esc(n)}">${armed ? "再按一次刪除" : "×"}</button>`
      : isOff ? `<button class="act up" type="button" data-show="${esc(key)}">上架</button>`
      : mode === "hide" ? `<button class="act" type="button" data-hide="${esc(key)}">下架</button>` : "";
    const info = isNew ? "上架中…" : gone ? "刪除中…" : hiding.has(key) ? "下架中…" : showing.has(key) ? "上架中…" : `${KIND_NAME[k]} · ${cm || 30} cm`;
    return `<div class="sw${isNew ? " new" : ""}${busy ? " gone" : ""}${armed ? " armed" : ""}"><i style="background-image:url('${url}')"></i>${btn}${esc(n)}<br>${info}</div>`;
  };
  $("list").innerHTML = pending.map(p => cell(p.name, p.kind, p.url, true, false, p.cm)).join("") +
    [...SHOP].reverse().map(s => cell(s.name, s.kind, SITE + s.file, false, false, s.cm)).join("");
  $("offList").innerHTML = [...OFF].reverse().map(s => cell(s.name, s.kind, SITE + s.file, false, true, s.cm)).join("");
  $("offWrap").hidden = !OFF.length;

}
// ---- 下架 shows a 下架 button on each swatch (one tap, it can be put back); 刪除 shows an ×: tap it, then tap again to confirm (no pop-ups). ----
let mode = "", armedKey = null;  // mode: "" | "hide" | "delete"
const removing = new Set(), hiding = new Set(), showing = new Set();  // "kind/name" sent to the repo, until the swatch site shows the change
function setMode(m) {
  mode = mode === m ? "" : m; armedKey = null;
  $("hideList").textContent = mode === "hide" ? "完成" : "下架";
  $("editList").textContent = mode === "delete" ? "完成" : "刪除";
  say($("listStatus"), mode === "hide" ? "按色卡上的「下架」，客人就看不到這張，照片會留著，之後可以再上架。" : mode === "delete" ? "按色卡右上角的 ×，再按一次確認，就會永久刪除（照片也會刪掉）。" : "", "wait");
  renderList();
}
$("hideList").addEventListener("click", () => setMode("hide"));
$("editList").addEventListener("click", () => setMode("delete"));
const fail = err => err.message === "Failed to fetch" ? "連不上 GitHub，請確認網路後再試一次。" : err.message;
const b64utf8 = s => { const b = new TextEncoder().encode(s); let out = ""; for (let i = 0; i < b.length; i += 0x8000) out += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(out); };
const utf8b64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
// hidden.json in the repo lists the swatches that are 下架, as "kind/name"; sizes.json gives each swatch's size in cm
// ({"kind/name": cm}; one it leaves out is 30 cm).
const editHidden = (change, message) => editJson("hidden.json", [], change, message);
async function editJson(path, empty, change, message) {
  for (let tries = 0; ; tries++) {
    const cur = await gh("/contents/" + path);
    if (!cur.ok && cur.status !== 404) throw new Error(cur.status === 401 ? "金鑰不正確或已過期，請到「設定」重新輸入。" : `讀不到 ${path}（${cur.status}）。`);
    const file = cur.ok ? await cur.json() : null;
    let list = empty;
    try { list = file ? JSON.parse(utf8b64(file.content)) : empty; } catch {}
    const next = change(list);
    if (JSON.stringify(next) === JSON.stringify(list)) return;
    const r = await gh("/contents/" + path, { method: "PUT", body: { message, content: b64utf8(JSON.stringify(next, null, 1) + "\n"), ...(file ? { sha: file.sha } : {}) } });
    if (r.ok) return;
    if ((r.status === 409 || r.status === 422) && tries < 2) continue;  // someone else changed it at the same moment: read it again
    throw new Error(r.status === 403 || r.status === 404 ? "這把金鑰沒有寫入權限。" : `儲存失敗（${r.status}），請再試一次。`);
  }
}
async function setOff(key, off) {
  const name = key.split("/").slice(1).join("/");
  if (!token) { renderList(); return say($("listStatus"), `試用模式：正式版會把「${name}」${off ? "下架（客人看不到，照片留著）" : "重新上架"}。這次沒有改。`, "wait"); }
  say($("listStatus"), `${off ? "下架" : "上架"}「${name}」中…`, "wait");
  try {
    await editHidden(list => off ? [...new Set([...list, key])] : list.filter(k => k !== key), `${off ? "Hide" : "Show"} swatch ${key}`);
    (off ? hiding : showing).add(key);
    say($("listStatus"), `「${name}」已${off ? "下架" : "重新上架"}，網站更新中（約 1–2 分鐘）…`, "wait");
    watchSite();
  } catch (err) { say($("listStatus"), fail(err), "bad"); }
  renderList();
}
document.querySelectorAll("#list, #offList").forEach(el => el.addEventListener("click", async e => {
  const h = e.target.closest("[data-hide]"); if (h) return setOff(h.dataset.hide, true);
  const u = e.target.closest("[data-show]"); if (u) return setOff(u.dataset.show, false);
  const b = e.target.closest("[data-del]"); if (!b) return;
  const key = b.dataset.del;
  if (armedKey !== key) { armedKey = key; return renderList(); }
  armedKey = null;
  const kind = key.split("/")[0], name = key.slice(kind.length + 1);
  if (!token) { renderList(); return say($("listStatus"), `試用模式：正式版會把「${name}」永久刪除。這次沒有刪除。`, "wait"); }
  say($("listStatus"), `刪除「${name}」中…`, "wait");
  try {
    const r = await gh(`/contents/${encodeURIComponent(kind)}`);
    if (!r.ok) throw new Error(r.status === 401 ? "金鑰不正確或已過期，請到「設定」重新輸入。" : `讀不到色卡資料夾（${r.status}）。`);
    const files = (await r.json()).filter(f => f.type === "file" && f.name.replace(/\.[^.]+$/, "") === name);
    if (!files.length) throw new Error(`色卡庫裡找不到「${name}」，可能已經刪掉了。`);
    for (const f of files) {
      const d = await gh(`/contents/${f.path.split("/").map(encodeURIComponent).join("/")}`, { method: "DELETE", body: { message: `Remove swatch ${name} (${kind})`, sha: f.sha } });
      if (!d.ok) throw new Error(d.status === 403 || d.status === 404 ? "這把金鑰沒有刪除權限。" : `刪除失敗（${d.status}），請再試一次。`);
    }
    // A deleted swatch leaves the 下架 list too, so a new photo with the same name isn't hidden.
    if (OFF.some(s => s.kind + "/" + s.name === key)) await editHidden(list => list.filter(k => k !== key), `Forget hidden swatch ${key}`);
    await editJson("sizes.json", {}, m => { const n = { ...m }; delete n[key]; return n; }, `Forget size of swatch ${key}`);
    removing.add(key);
    say($("listStatus"), `「${name}」已刪除，網站更新中（約 1–2 分鐘）…`, "wait");
    watchSite();
  } catch (err) { say($("listStatus"), fail(err), "bad"); }
  renderList();
}));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function watchSite() {
  clearInterval(watching);
  let tries = 0;
  watching = setInterval(async () => {
    await loadShop();
    if (!pending.length && !removing.size && !hiding.size && !showing.size) clearInterval(watching);
    else if (++tries > 40) { clearInterval(watching); say($("status"), "上傳成功，但網站還沒更新完成。稍後重新整理這頁看看。", "wait"); }
  }, 15000);
}

// Method 2+ (from swatch-kit.js): even out the light (divide by a very soft copy), then blend the edges with a copy
// shifted by half a tile, so the swatch repeats on the shoe without seams.
function makeSeamless(src, N = 1024, band = 0.22) {
  const mk = n => { const c = document.createElement("canvas"); c.width = c.height = n; return c; };
  const c = mk(N), x = c.getContext("2d");
  x.drawImage(src, 0, 0, N, N);
  const a = x.getImageData(0, 0, N, N).data;
  const t = mk(10), b = mk(N), bx = b.getContext("2d");
  t.getContext("2d").imageSmoothingQuality = "high"; t.getContext("2d").drawImage(c, 0, 0, 10, 10);
  bx.imageSmoothingEnabled = true; bx.imageSmoothingQuality = "high"; bx.drawImage(t, 0, 0, N, N);
  const low = bx.getImageData(0, 0, N, N).data, mean = [0, 0, 0];
  for (let i = 0; i < a.length; i += 4) for (let ch = 0; ch < 3; ch++) mean[ch] += a[i + ch];
  for (let ch = 0; ch < 3; ch++) mean[ch] /= N * N;
  const f = new Float32Array(N * N * 3);
  for (let p = 0, i = 0; p < N * N; p++, i += 4) for (let ch = 0; ch < 3; ch++) f[p * 3 + ch] = a[i + ch] / Math.max(low[i + ch], 1) * mean[ch];
  const out = x.createImageData(N, N), o = out.data, h = N >> 1, bw = N * band;
  for (let y = 0; y < N; y++) for (let xx = 0; xx < N; xx++) {
    let w = Math.min(Math.min(xx, y, N - 1 - xx, N - 1 - y) / bw, 1); w = w * w * (3 - 2 * w);
    const p = y * N + xx, q = ((y + h) % N) * N + (xx + h) % N;
    for (let ch = 0; ch < 3; ch++) o[p * 4 + ch] = w * f[p * 3 + ch] + (1 - w) * f[q * 3 + ch];
    o[p * 4 + 3] = 255;
  }
  x.putImageData(out, 0, 0);
  return c;
}

// ---- Camera and crop: the studio's frame, 5–30 cm (slider, remembered). A phone can't measure distance, so the square is a guide. ----
let camStream = null, useNative = false;  // useNative: the in-app camera failed, so the next click opens the phone's own camera
let camCm = Math.min(30, Math.max(5, +store.get("aika-upload-cam-cm") || 30));
// Ticks every cm (long every 5), numbers every 5 cm, or every cm on a frame of 10 cm or less.
function drawRuler() {
  const cm = camCm, u = 300 / cm, step = cm <= 10 ? 1 : 5;
  let ticks = "", nums = "";
  for (let i = 0; i <= cm; i++) {
    const v = i * u, len = i % 5 ? 7 : 14;
    ticks += `<line x1="${v}" y1="0" x2="${v}" y2="${len}"/><line x1="0" y1="${v}" x2="${len}" y2="${v}"/><line x1="${v}" y1="300" x2="${v}" y2="${300 - len}"/><line x1="300" y1="${v}" x2="${300 - len}" y2="${v}"/>`;
  }
  for (let i = 0; i <= cm; i += step) nums += `<text x="${i * u}" y="28">${i}</text>`;
  $("camRuler").innerHTML = `<g stroke="#000" stroke-opacity=".5" stroke-width="3">${ticks}</g><g stroke="#fff" stroke-width="1.4">${ticks}</g>` +
    `<g fill="#fff" font-size="11" font-weight="800" text-anchor="middle" stroke="#000" stroke-opacity=".55" stroke-width="2.5" style="paint-order:stroke">${nums}<text x="150" y="46">cm</text></g>`;
  document.querySelectorAll("#cam .cm").forEach(el => el.textContent = cm);
  $("camCm").value = cm;
}
function setCamCm(cm) { camCm = Math.min(30, Math.max(5, Math.round(cm))); store.set("aika-upload-cam-cm", String(camCm)); drawRuler(); }
$("camCm").addEventListener("input", e => setCamCm(+e.target.value));
$("camLess").addEventListener("click", () => setCamCm(camCm - 1));
$("camMore").addEventListener("click", () => setCamCm(camCm + 1));
drawRuler();
const CAM_OPTS = { video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1920 } }, audio: false };
async function openCam(fallback) {
  try {
    camStream = await navigator.mediaDevices.getUserMedia(CAM_OPTS);
  } catch { camStream = null; useNative = true; fallback.click(); return; }
  $("camVideo").srcObject = camStream; $("camWake").hidden = true;
  $("cam").classList.remove("crop"); $("cam").hidden = false;
  wakeCam();
}
function closeCam() {
  clearTimeout(camIdle); camResume = false; $("camWake").hidden = true;
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null; $("camVideo").srcObject = null; $("cam").hidden = true;
  if (crop) { URL.revokeObjectURL(crop.url); crop = null; $("cropImg").removeAttribute("src"); }
}
// The live camera only runs while someone is using it. It stops when the page is hidden (another tab or app,
// the phone locks) and comes back on return, and after a minute without a touch it stops until 開啟相機 is tapped.
const CAM_IDLE_MS = 60 * 1000;
let camIdle = 0, camResume = false;
function pauseCam() {
  clearTimeout(camIdle);
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null; $("camVideo").srcObject = null; $("camWake").hidden = false;
}
const camWanted = () => !$("cam").hidden && !$("cam").classList.contains("crop") && !camStream && !document.hidden;
async function resumeCam() {
  if (!camWanted()) return;
  let s;
  try { s = await navigator.mediaDevices.getUserMedia(CAM_OPTS); } catch { return; }
  if (!camWanted()) { s.getTracks().forEach(t => t.stop()); return; }  // closed or hidden while asking
  camStream = s; $("camVideo").srcObject = s; $("camWake").hidden = true;
  wakeCam();
}
function wakeCam() { clearTimeout(camIdle); if (camStream) camIdle = setTimeout(pauseCam, CAM_IDLE_MS); }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { camResume = camResume || !!camStream; if (camStream) pauseCam(); }
  else if (camResume) { camResume = false; resumeCam(); }
});
addEventListener("pagehide", () => { if (camStream) { camResume = true; pauseCam(); } });
$("cam").addEventListener("pointerdown", wakeCam);
$("camWake").addEventListener("click", resumeCam);
let crop = null;
const pointers = new Map();
function openCrop(file) {
  const img = $("cropImg"), url = URL.createObjectURL(file);
  img.onload = () => {
    $("cam").classList.add("crop"); $("cam").hidden = false;
    const f = $("camFrame").getBoundingClientRect();
    const s = Math.max(f.width / img.naturalWidth, f.height / img.naturalHeight);  // smallest size that fills the frame
    crop = { url, min: s, s, x: f.left + (f.width - img.naturalWidth * s) / 2, y: f.top + (f.height - img.naturalHeight * s) / 2 };
    drawCrop();
  };
  img.onerror = () => { URL.revokeObjectURL(url); say($("status"), "這張照片打不開，請換一張（或用拍照）。", "bad"); };
  img.src = url;
}
function drawCrop() {
  const img = $("cropImg"), f = $("camFrame").getBoundingClientRect(), w = img.naturalWidth * crop.s, h = img.naturalHeight * crop.s;
  crop.x = Math.min(f.left, Math.max(f.right - w, crop.x));
  crop.y = Math.min(f.top, Math.max(f.bottom - h, crop.y));
  img.style.transform = `translate(${crop.x}px, ${crop.y}px) scale(${crop.s})`;
}
function zoomCrop(k, cx, cy) {
  const s = Math.min(Math.max(crop.s * k, crop.min), crop.min * 12);
  crop.x = cx - (cx - crop.x) * s / crop.s; crop.y = cy - (cy - crop.y) * s / crop.s; crop.s = s;
  drawCrop();
}
const cam = $("cam");
cam.addEventListener("pointerdown", e => { if (crop && !e.target.closest("button, label, .cam-size")) { pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); cam.setPointerCapture(e.pointerId); } });
cam.addEventListener("pointermove", e => {
  const prev = pointers.get(e.pointerId);
  if (!crop || !prev) return;
  const pts = [...pointers.values()];
  if (pts.length === 1) { crop.x += e.clientX - prev.x; crop.y += e.clientY - prev.y; drawCrop(); }
  else {
    const other = pts.find(p => p !== prev), d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(e.clientX - other.x, e.clientY - other.y);
    const m0 = [(prev.x + other.x) / 2, (prev.y + other.y) / 2], m1 = [(e.clientX + other.x) / 2, (e.clientY + other.y) / 2];
    crop.x += m1[0] - m0[0]; crop.y += m1[1] - m0[1];
    if (d0 > 0) zoomCrop(d1 / d0, m1[0], m1[1]); else drawCrop();

["pointerup", "pointercancel"].forEach(t => cam.addEventListener(t, e => pointers.delete(e.pointerId)));
cam.addEventListener("wheel", e => { if (crop) { e.preventDefault(); zoomCrop(Math.exp(-e.deltaY / 300), e.clientX, e.clientY); } }, { passive: false });
$("cropUse").addEventListener("click", () => {
  if (!crop) return;
  const img = $("cropImg"), f = $("camFrame").getBoundingClientRect();
  const side = Math.min(f.width / crop.s, img.naturalWidth, img.naturalHeight);
  setShot(img, Math.max(0, (f.left - crop.x) / crop.s), Math.max(0, (f.top - crop.y) / crop.s), side);
  closeCam();
});
$("camCancel").addEventListener("click", closeCam);
$("camNative").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; closeCam(); if (f) openCrop(f); });
$("camShot").addEventListener("click", () => {
  const v = $("camVideo"), vw = v.videoWidth, vh = v.videoHeight;
  if (!vw) return;
  const box = v.getBoundingClientRect(), f = $("camFrame").getBoundingClientRect();
  const s = Math.max(box.width / vw, box.height / vh), ox = (box.width - vw * s) / 2, oy = (box.height - vh * s) / 2;
  const side = Math.min(f.width / s, vw, vh);
  const sx = Math.min(Math.max((f.left - box.left - ox) / s, 0), vw - side), sy = Math.min(Math.max((f.top - box.top - oy) / s, 0), vh - side);
  setShot(v, sx, sy, side);
  closeCam();
});
["snapIn", "albumIn"].forEach(id => $(id).addEventListener("change", e => { if (e.target.files[0]) openCrop(e.target.files[0]); e.target.value = ""; }));
$("snapIn").addEventListener("click", e => {
  if (useNative || !navigator.mediaDevices?.getUserMedia) { useNative = false; return; }
  e.preventDefault(); openCam($("snapIn"));
});

showTrial();
loadShop();
</script>
